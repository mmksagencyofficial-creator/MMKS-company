<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to MMKS Digital Marketing Agency Dashboard">
    <meta name="theme-color" content="#0f2137">
    
    <title>Login - MMKS Digital Marketing Agency</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=DM+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --navy: #0f2137;
            --navy-mid: #12294a;
            --navy-light: #1a3a5c;
            --green: #1e7e34;
            --green-mid: #23963d;
            --green-light: #28a745;
            --green-bright: #1e7e34;
            --accent: #23963d;
            --white: #ffffff;
            --off-white: #f4faf6;
            --text-body: #2d3e30;
            --text-muted: #5a7a62;
            --border: rgba(30, 126, 52, 0.18);
            --card-bg: #ffffff;
            --gradient-green: linear-gradient(135deg, #1e7e34, #34c759);
            --gradient-navy: linear-gradient(135deg, #0f2137, #1a3a5c);
            --gradient-mixed: linear-gradient(135deg, #0f2137 0%, #1e7e34 100%);
            --page-bg: #f4faf6;
            --section-alt: #edf7f0;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #f4faf6 50%, #edf7f0 100%);
            color: var(--text-body);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* SCROLL PROGRESS */
        .scroll-progress {
            position: fixed; top: 0; left: 0;
            height: 3px;
            background: var(--gradient-green);
            z-index: 2000; width: 0%;
            transition: width 0.1s;
        }

        /* NAV */
        nav {
            position: fixed; top: 0; width: 100%;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 5px solid rgba(30, 126, 52, 0.15);
            padding: 0.1rem 0rem;
            box-shadow: 0 2px 20px rgba(30, 126, 52, 0.08);
        }

        .nav-container {
            max-width: 1200px; margin: 0 auto;
            padding: 0 24px;
            display: flex; justify-content: space-between; align-items: center;
            gap: 1rem;
        }

        .logo {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.9rem; font-weight: 900;
            letter-spacing: -1px;
            background: var(--gradient-green);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            cursor: pointer;
        }

        .nav-links { display: flex; gap: 2rem; list-style: none; align-items: center; }
        .nav-links a {
            color: #2d3e30; text-decoration: none;
            font-weight: 500; font-size: 0.95rem;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: var(--green); }

        .cta-btn {
            background: var(--gradient-green);
            color: white; padding: 0.6rem 1.4rem;
            border: none; border-radius: 50px;
            cursor: pointer; font-weight: 700;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.9rem;
            transition: all 0.3s;
            margin-left: 1rem;
        }
        .cta-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(30, 126, 52, 0.4); }

        .mobile-menu-btn { display: none; background: none; border: none; color: #2d3e30; font-size: 1.5rem; cursor: pointer; z-index: 999; }
        
        .mobile-menu {
            display: none;
            position: fixed; top: 62px; left: 0; right: 0;
            background: #ffffff;
            flex-direction: column; gap: 0;
            list-style: none;
            box-shadow: 0 4px 20px rgba(30, 126, 52, 0.15);
            z-index: 998;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .mobile-menu.active { display: flex; max-height: 400px; }
        .mobile-menu li { padding: 0; }
        .mobile-menu a {
            display: block; padding: 1rem 24px; color: #2d3e30; text-decoration: none;
            font-weight: 500; border-bottom: 1px solid rgba(30, 126, 52, 0.1);
            transition: background 0.3s;
        }
        .mobile-menu a:hover { background: rgba(30, 126, 52, 0.05); color: var(--green); }

        /* LOGIN CONTAINER */
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 24px 60px;
            min-height: calc(100vh - 62px);
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 10px 50px rgba(30, 126, 52, 0.12);
            border: 1px solid rgba(30, 126, 52, 0.1);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-header h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: var(--navy);
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--text-body);
            margin-bottom: 0.6rem;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 2px solid rgba(30, 126, 52, 0.2);
            border-radius: 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s;
            background: #f8fafb;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--green);
            background: white;
            box-shadow: 0 0 0 3px rgba(30, 126, 52, 0.1);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--green);
        }

        .remember-me label {
            cursor: pointer;
            color: var(--text-body);
            margin: 0;
        }

        .forgot-password {
            color: var(--green);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .forgot-password:hover {
            color: var(--green-mid);
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: var(--gradient-green);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(30, 126, 52, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 2rem 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(30, 126, 52, 0.15);
        }

        .divider span {
            margin: 0 1rem;
        }

        .social-login {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .social-btn {
            padding: 0.8rem;
            border: 2px solid rgba(30, 126, 52, 0.2);
            background: white;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: var(--text-body);
        }

        .social-btn:hover {
            border-color: var(--green);
            background: rgba(30, 126, 52, 0.05);
        }

        .signup-link {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .signup-link a {
            color: var(--green);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s;
        }

        .signup-link a:hover {
            color: var(--green-mid);
        }

        .back-home {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: var(--green);
            font-weight: 600;
            margin-bottom: 2rem;
            transition: all 0.3s;
        }

        .back-home:hover {
            gap: 1rem;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .mobile-menu { display: flex; }
            .mobile-menu-btn { display: block; }
            .nav-container > .cta-btn { display: none; margin-left: 0; }
            
            .login-container {
                padding: 2rem;
                max-width: 90%;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }

            .login-wrapper {
                padding: 80px 20px 40px;
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 1.5rem;
            }

            .login-header h1 {
                font-size: 1.3rem;
            }

            .remember-forgot {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .social-login {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="scroll-progress"></div>

<!-- NAV -->
<nav>
    <div class="nav-container">
        <div class="logo" onclick="window.location.href='index.html'">MMKS</div>
        <ul class="nav-links">
            <li><a href="index.html#services">Services</a></li>
            <li><a href="index.html#pricing">Pricing</a></li>
            <li><a href="index.html#packages">Packages</a></li>
            <li><a href="index.html#portfolio">Portfolio</a></li>
            <li><a href="index.html#contact">Contact</a></li>
        </ul>
        <button class="cta-btn" onclick="window.location.href='index.html'">Home</button>
        <button class="mobile-menu-btn" id="mobile-toggle" aria-label="Toggle mobile menu">☰</button>
    </div>
    <ul class="mobile-menu nav-links" id="mobile-menu">
        <li><a href="index.html#services" onclick="toggleMobileMenu()">Services</a></li>
        <li><a href="index.html#pricing" onclick="toggleMobileMenu()">Pricing</a></li>
        <li><a href="index.html#packages" onclick="toggleMobileMenu()">Packages</a></li>
        <li><a href="index.html#portfolio" onclick="toggleMobileMenu()">Portfolio</a></li>
        <li><a href="index.html#contact" onclick="toggleMobileMenu()">Contact</a></li>
    </ul>
</nav>

<!-- LOGIN FORM -->
<div class="login-wrapper">
    <div class="login-container">
        <a href="index.html" class="back-home">← Back to Home</a>
        
        <div class="login-header">
            <h1>Welcome Back</h1>
            <p>Login to access your dashboard</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <div class="remember-forgot">
                <div class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember me</label>
                </div>
                <a href="#" class="forgot-password">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="divider">
            <span>OR</span>
        </div>

        <div class="social-login">
            <button class="social-btn" onclick="loginWithGoogle()">
                <span>🔷</span> Google
            </button>
            <button class="social-btn" onclick="loginWithGithub()">
                <span>⚫</span> GitHub
            </button>
        </div>

        <div class="signup-link">
            Don't have an account? <a href="mailto:mmksagency.official@gmail.com">Sign up here</a>
        </div>
    </div>
</div>

<script>
    // Mobile menu toggle
    const mobileToggle = document.getElementById('mobile-toggle');
    const mobileMenu = document.getElementById('mobile-menu');

    if (mobileToggle) {
        mobileToggle.addEventListener('click', toggleMobileMenu);
    }

    function toggleMobileMenu() {
        mobileMenu.classList.toggle('active');
    }

    // Login form handler
    function handleLogin(event) {
        event.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const remember = document.getElementById('remember').checked;

        // Simple validation
        if (!email || !password) {
            alert('Please fill in all fields');
            return;
        }

        // Admin email check
        const adminEmail = 'mmksagency.official@gmail.com';
        const isAdmin = email === adminEmail;

        // Store credentials if remember me is checked
        if (remember) {
            localStorage.setItem('rememberedEmail', email);
        } else {
            localStorage.removeItem('rememberedEmail');
        }

        // Store user session
        localStorage.setItem('userEmail', email);
        localStorage.setItem('isAdmin', isAdmin);
        localStorage.setItem('loginTime', new Date().getTime());

        console.log('Login attempt:', { email, password, remember, isAdmin });
        
        // Redirect based on user type
        if (isAdmin) {
            alert('Welcome Admin! Redirecting to Admin Dashboard...');
            window.location.href = 'admin-dashboard.html';
        } else {
            alert('Login successful! Redirecting to dashboard...');
            window.location.href = 'user-dashboard.html';
        }
    }

    // Social login handlers
    function loginWithGoogle() {
        alert('Google login coming soon!');
        // Implement Google OAuth
    }

    function loginWithGithub() {
        alert('GitHub login coming soon!');
        // Implement GitHub OAuth
    }

    // Load remembered email on page load
    window.addEventListener('DOMContentLoaded', function() {
        const rememberedEmail = localStorage.getItem('rememberedEmail');
        if (rememberedEmail) {
            document.getElementById('email').value = rememberedEmail;
            document.getElementById('remember').checked = true;
        }
    });

    // Scroll progress indicator
    window.addEventListener('scroll', function() {
        const scrollProgress = document.querySelector('.scroll-progress');
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        const scrollPercent = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
        scrollProgress.style.width = scrollPercent + '%';
    });
</script>

</body>
</html>
